<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000000;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 32px;
            color: #e7e9ea;
        }

        .logo span { color: #1d9bf0; }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #71767b;
            font-size: 15px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #71767b;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #000000;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #1d9bf0;
        }

        input::placeholder { color: #3f4447; }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: inherit;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: #e7e9ea;
            color: #000000;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #71767b;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #2f3336;
        }

        .btn-outline {
            background: transparent;
            color: #e7e9ea;
            border: 1px solid #2f3336 !important;
            border: none;
        }

        .error-msg {
            background: #2a0d0d;
            border: 1px solid #4a1a1a;
            color: #f87171;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #71767b;
            font-size: 14px;
        }

        .footer-text a {
            color: #1d9bf0;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover { text-decoration: underline; }

        .brain-icon {
            text-align: center;
            font-size: 32px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brain-icon">🧠</div>
        <div class="logo">Mind<span>X</span></div>

        <h1>Sign in to MindX</h1>
        <p class="subtitle">Your mental wellness social platform</p>

        <div class="error-msg" id="errorMsg"></div>

        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password"
                onkeydown="if(event.key==='Enter') login()" />
        </div>

        <button class="btn btn-primary" onclick="login()" id="loginBtn">
            Sign in
        </button>

        <div class="divider">or</div>

        <div class="footer-text">
            Don't have an account?
            <a href="/signup">Sign up here</a>
        </div>

    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                showError('Please fill in all fields!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/feed';
                } else {
                    showError(data.error);
                }
            } catch (e) {
                showError('Something went wrong. Please try again!');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
