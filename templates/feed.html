<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindX - Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        [data-theme="dark"] {
            --bg: #000000;
            --bg2: #16181c;
            --bg3: #1d1f23;
            --border: #2f3336;
            --text: #e7e9ea;
            --text2: #71767b;
            --accent: #1d9bf0;
            --pos-bg: #0d2a1f; --pos-border: #1a4731; --pos-text: #4ade80;
            --neu-bg: #2a2200; --neu-border: #4a3800; --neu-text: #fbbf24;
            --neg-bg: #2a0d0d; --neg-border: #4a1a1a; --neg-text: #f87171;
            --help-bg: #0d1a2a; --help-border: #1a3a5c;
            --tip-bg: #0d2a1f; --tip-border: #1a4731;
            --like-active: #f91880;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --bg2: #f7f9f9;
            --bg3: #eff3f4;
            --border: #cfd9de;
            --text: #0f1419;
            --text2: #536471;
            --accent: #1d9bf0;
            --pos-bg: #f0fff4; --pos-border: #9ae6b4; --pos-text: #276749;
            --neu-bg: #fffbf0; --neu-border: #fbd38d; --neu-text: #744210;
            --neg-bg: #fff5f5; --neg-border: #feb2b2; --neg-text: #742a2a;
            --help-bg: #eff8ff; --help-border: #90cdf4;
            --tip-bg: #f0fff4; --tip-border: #9ae6b4;
            --like-active: #f91880;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 53px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 900;
            color: var(--text);
        }

        .nav-logo span { color: var(--accent); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-user {
            font-size: 14px;
            color: var(--text2);
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--neg-text);
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        /* LAYOUT */
        .layout {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 53px;
        }

        .feed-header {
            padding: 14px 16px;
            font-size: 20px;
            font-weight: 800;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 53px;
            background: var(--bg);
            z-index: 50;
        }

        /* COMPOSER */
        .composer {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .composer-inner {
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #7856ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .composer-right { flex: 1; }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 18px;
            font-family: inherit;
            resize: none;
            min-height: 80px;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--text2); }

        .composer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .char-count {
            font-size: 13px;
            color: var(--text2);
        }

        .char-count.warn { color: #fbbf24; }
        .char-count.danger { color: #f87171; }

        .post-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .post-btn:hover { opacity: 0.9; }
        .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* POSTS */
        .post {
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            transition: background 0.2s;
        }

        .post:hover { background: var(--bg3); }

        .post-inner {
            display: flex;
            gap: 12px;
        }

        .post-right { flex: 1; min-width: 0; }

        .post-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }

        .post-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text);
        }

        .post-handle {
            color: var(--text2);
            font-size: 14px;
        }

        .post-time {
            color: var(--text2);
            font-size: 14px;
        }

        .post-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .sentiment-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            border: 1px solid;
        }

        .badge-positive { background: var(--pos-bg); border-color: var(--pos-border); color: var(--pos-text); }
        .badge-neutral { background: var(--neu-bg); border-color: var(--neu-border); color: var(--neu-text); }
        .badge-negative { background: var(--neg-bg); border-color: var(--neg-border); color: var(--neg-text); }

        /* POST ACTIONS */
        .post-actions {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text2);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            border-radius: 20px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .action-btn:hover { background: var(--bg3); }

        .action-btn.liked {
            color: var(--like-active);
        }

        .action-btn .icon { font-size: 16px; }

        /* COMMENTS */
        .comments-section {
            margin-top: 10px;
            display: none;
        }

        .comments-section.open { display: block; }

        .comment {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-top: 1px solid var(--border);
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7856ff, var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .comment-right { flex: 1; }

        .comment-header {
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 2px;
        }

        .comment-header strong {
            color: var(--text);
            font-weight: 700;
        }

        .comment-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.4;
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .comment-input {
            flex: 1;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            min-height: 36px;
            resize: none;
        }

        .comment-input:focus { border-color: var(--accent); }
        .comment-input::placeholder { color: var(--text2); }

        .comment-submit {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        /* HELP SECTION */
        .help-card {
            margin-top: 10px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--neg-border);
            display: none;
        }

        .help-card.show { display: block; }

        .help-banner {
            background: linear-gradient(135deg, #7856ff, #1d9bf0);
            padding: 14px 16px;
            color: white;
            text-align: center;
        }

        .help-banner h4 {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .help-banner p {
            font-size: 12px;
            opacity: 0.9;
        }

        .helplines {
            background: var(--help-bg);
            padding: 12px;
            display: grid;
            gap: 8px;
        }

        .helpline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--help-border);
            border-radius: 10px;
        }

        .helpline-left { display: flex; align-items: center; gap: 10px; }

        .helpline-left h5 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .helpline-left p {
            font-size: 11px;
            color: var(--text2);
        }

        .call-btn {
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .tips-section {
            background: var(--tip-bg);
            padding: 12px;
            border-top: 1px solid var(--tip-border);
        }

        .tips-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .tip-item {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: flex-start;
        }

        .tip-item span:first-child { font-size: 16px; flex-shrink: 0; }

        .tip-item p {
            font-size: 12px;
            color: var(--text2);
            line-height: 1.4;
        }

        .tip-item strong {
            color: var(--text);
            display: block;
            font-size: 12px;
            margin-bottom: 2px;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
        }

        .empty-state .big { font-size: 40px; margin-bottom: 12px; }
        .empty-state h3 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
        .empty-state p { font-size: 15px; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-logo">🧠 Mind<span>X</span></div>
        <div class="nav-right">
            <span class="nav-user">@{{ username }}</span>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="layout">
        <div class="feed-header">Home</div>

        <!-- COMPOSER -->
        <div class="composer">
            <div class="composer-inner">
                <div class="avatar" id="userAvatar">{{ name[0] }}</div>
                <div class="composer-right">
                    <textarea
                        id="postInput"
                        placeholder="What's on your mind?"
                        maxlength="280"
                        oninput="updateChar()"
                    ></textarea>
                    <div class="composer-footer">
                        <span class="char-count" id="charCount">280</span>
                        <button class="post-btn" onclick="createPost()" id="postBtn">Post</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FEED -->
        <div id="feed">
            <div class="loading">Loading posts... ⏳</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        const currentUser = "{{ username }}";
        const currentName = "{{ name }}";

        // THEME
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                btn.textContent = '☀️';
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '🌙';
            }
        }

        // CHAR COUNT
        function updateChar() {
            const input = document.getElementById('postInput');
            const count = document.getElementById('charCount');
            const remaining = 280 - input.value.length;
            count.textContent = remaining;
            count.className = 'char-count';
            if (remaining < 50) count.classList.add('warn');
            if (remaining < 20) count.classList.add('danger');
        }

        // TOAST
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // CREATE POST
        async function createPost() {
            const content = document.getElementById('postInput').value.trim();
            if (!content) return;
            const btn = document.getElementById('postBtn');
            btn.disabled = true;
            btn.textContent = 'Posting...';
            try {
                const res = await fetch('/api/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('postInput').value = '';
                    updateChar();
                    showToast('Posted! AI detected: ' + data.sentiment + ' ' + data.sentiment_emoji);
                    loadFeed();
                }
            } catch(e) {
                showToast('Something went wrong!');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Post';
            }
        }

        // LOAD FEED
        async function loadFeed() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const feed = document.getElementById('feed');

                if (posts.length === 0) {
                    feed.innerHTML = `
                        <div class="empty-state">
                            <div class="big">🧠</div>
                            <h3>No posts yet!</h3>
                            <p>Be the first to share how you're feeling.</p>
                        </div>`;
                    return;
                }

                feed.innerHTML = posts.map(post => renderPost(post)).join('');
            } catch(e) {
                console.error(e);
            }
        }

        // RENDER POST
        function renderPost(post) {
            const badgeClass = 'badge-' + post.sentiment_color;
            const likeClass = post.liked ? 'action-btn liked' : 'action-btn';
            const likeIcon = post.liked ? '❤️' : '🤍';
            const showHelp = post.sentiment_color === 'negative';

            const commentsHtml = post.comments.map(c => `
                <div class="comment">
                    <div class="comment-avatar">${c.name[0]}</div>
                    <div class="comment-right">
                        <div class="comment-header">
                            <strong>${c.name}</strong> @${c.username} · ${c.created_at}
                        </div>
                        <div class="comment-text">${escapeHtml(c.content)}</div>
                    </div>
                </div>
            `).join('');

            const helpHtml = showHelp ? `
                <div class="help-card show">
                    <div class="help-banner">
                        <h4>💙 You Are Not Alone</h4>
                        <p>Reach out — trained counselors are here for you 24/7</p>
                    </div>
                    <div class="helplines">
                        <div class="helpline-item">
                            <div class="helpline-left">
                                <span>🏥</span>
                                <div>
                                    <h5>iCall — TISS</h5>
                                    <p>Mon–Sat 8am–10pm</p>
                                </div>
                            </div>
                            <a href="tel:9152987821" class="call-btn">9152987821</a>
                        </div>
                        <div class="helpline-item">
                            <div class="helpline-left">
                                <span>💚</span>
                                <div>
                                    <h5>Vandrevala Foundation</h5>
                                    <p>24/7 Free & confidential</p>
                                </div>
                            </div>
                            <a href="tel:18602662345" class="call-btn">1860-2662-345</a>
                        </div>
                        <div class="helpline-item">
                            <div class="helpline-left">
                                <span>🆘</span>
                                <div>
                                    <h5>NIMHANS</h5>
                                    <p>National mental health helpline</p>
                                </div>
                            </div>
                            <a href="tel:08046110007" class="call-btn">080-46110007</a>
                        </div>
                    </div>
                    <div class="tips-section">
                        <div class="tips-title">🧘 Try These Right Now</div>
                        <div class="tip-item">
                            <span>🌬️</span>
                            <p><strong>4-7-8 Breathing</strong>Breathe in 4 sec, hold 7, out 8. Repeat 3 times.</p>
                        </div>
                        <div class="tip-item">
                            <span>🖐️</span>
                            <p><strong>5-4-3-2-1 Grounding</strong>Name 5 things you see, 4 touch, 3 hear, 2 smell, 1 taste.</p>
                        </div>
                        <div class="tip-item">
                            <span>🤗</span>
                            <p><strong>Reach Out</strong>Text someone you trust right now. Just say "I need to talk."</p>
                        </div>
                    </div>
                </div>` : '';

            return `
                <div class="post" id="post-${post.id}">
                    <div class="post-inner">
                        <div class="avatar">${post.name[0]}</div>
                        <div class="post-right">
                            <div class="post-header">
                                <span class="post-name">${post.name}</span>
                                <span class="post-handle">@${post.username}</span>
                                <span class="post-time">· ${post.created_at}</span>
                            </div>
                            <div class="post-text">${escapeHtml(post.content)}</div>
                            <div class="sentiment-badge ${badgeClass}">
                                ${post.sentiment_emoji} ${post.sentiment}
                            </div>
                            ${helpHtml}
                            <div class="post-actions">
                                <button class="${likeClass}" id="like-btn-${post.id}"
                                    onclick="toggleLike(${post.id})">
                                    <span class="icon">${likeIcon}</span>
                                    <span id="like-count-${post.id}">${post.likes_count}</span>
                                </button>
                                <button class="action-btn" onclick="toggleComments(${post.id})">
                                    <span class="icon">💬</span>
                                    <span id="comment-count-${post.id}">${post.comments.length}</span>
                                </button>
                            </div>
                            <div class="comments-section" id="comments-${post.id}">
                                <div id="comments-list-${post.id}">${commentsHtml}</div>
                                <div class="comment-input-row">
                                    <textarea
                                        class="comment-input"
                                        id="comment-input-${post.id}"
                                        placeholder="Write a comment..."
                                        rows="1"
                                    ></textarea>
                                    <button class="comment-submit"
                                        onclick="submitComment(${post.id})">Reply</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // TOGGLE LIKE
        async function toggleLike(postId) {
            try {
                const res = await fetch(`/api/like/${postId}`, { method: 'POST' });
                const data = await res.json();
                const btn = document.getElementById(`like-btn-${postId}`);
                const count = document.getElementById(`like-count-${postId}`);
                count.textContent = data.count;
                if (data.liked) {
                    btn.className = 'action-btn liked';
                    btn.querySelector('.icon').textContent = '❤️';
                } else {
                    btn.className = 'action-btn';
                    btn.querySelector('.icon').textContent = '🤍';
                }
            } catch(e) { console.error(e); }
        }

        // TOGGLE COMMENTS
        function toggleComments(postId) {
            const section = document.getElementById(`comments-${postId}`);
            section.classList.toggle('open');
        }

        // SUBMIT COMMENT
        async function submitComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const content = input.value.trim();
            if (!content) return;
            try {
                const res = await fetch(`/api/comment/${postId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (data.success) {
                    const c = data.comment;
                    const list = document.getElementById(`comments-list-${postId}`);
                    list.innerHTML += `
                        <div class="comment">
                            <div class="comment-avatar">${c.name[0]}</div>
                            <div class="comment-right">
                                <div class="comment-header">
                                    <strong>${c.name}</strong> @${c.username} · ${c.created_at}
                                </div>
                                <div class="comment-text">${escapeHtml(c.content)}</div>
                            </div>
                        </div>`;
                    input.value = '';
                    const countEl = document.getElementById(`comment-count-${postId}`);
                    countEl.textContent = parseInt(countEl.textContent) + 1;
                }
            } catch(e) { console.error(e); }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        // ENTER TO POST
        document.addEventListener('DOMContentLoaded', function() {
            loadFeed();
            document.getElementById('postInput').addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') createPost();
            });
        });
    </script>
